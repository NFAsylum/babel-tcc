name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  core-build-test:
    name: Core C# (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Checkout translations repo
        uses: actions/checkout@v4
        with:
          repository: NFAsylum/babel-tcc-translations
          path: babel-tcc-translations

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Lint (dotnet format)
        if: matrix.os == 'ubuntu-latest'
        run: dotnet format --verify-no-changes --verbosity diagnostic

      - name: Test with coverage
        env:
          BABEL_TCC_TRANSLATIONS_PATH: ${{ github.workspace }}/babel-tcc-translations
        run: >
          dotnet test --no-build --configuration Release
          --collect:"XPlat Code Coverage"
          --results-directory TestResults
          --filter "Category!=Research"

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: core-coverage
          path: TestResults/**/coverage.cobertura.xml

  vscode-build-test:
    name: VS Code Extension (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    defaults:
      run:
        working-directory: packages/ide-adapters/vscode

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: packages/ide-adapters/vscode/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('packages/ide-adapters/vscode/package-lock.json') }}

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test with coverage
        run: npm run test:coverage

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: vscode-coverage
          path: packages/ide-adapters/vscode/coverage/lcov.info

  # So ubuntu: o plugin compila para bytecode independente de plataforma, e a parte que e
  # especifica de SO (o Core.Host embutido) ja e coberta pela matriz do core-build-test.
  intellij-build-test:
    name: IntelliJ Plugin (ubuntu-latest)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: packages/ide-adapters/intellij

    steps:
      - uses: actions/checkout@v4

      - name: Checkout translations repo
        uses: actions/checkout@v4
        with:
          repository: NFAsylum/babel-tcc-translations
          path: babel-tcc-translations

      # O build.gradle.kts resolve as traducoes como IRMA do repo (babelRepoRoot.parentFile),
      # que e o layout de desenvolvimento local. O actions/checkout so escreve dentro do
      # workspace, entao movemos um nivel acima para a task bundleTranslations encontrar.
      - name: Move translations alongside the repo
        working-directory: ${{ github.workspace }}
        run: mv babel-tcc-translations ../babel-tcc-translations

      # A task buildCoreHost roda `dotnet publish`: o plugin embute o Core.Host no bundle.
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Faz cache de ~/.gradle, que inclui o SDK do IntelliJ (~1GB) baixado na primeira execucao.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test
        run: ./gradlew test --console=plain

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: intellij-test-report
          path: packages/ide-adapters/intellij/build/reports/tests/test/

  coverage-report:
    name: Coverage Report
    needs: [core-build-test, vscode-build-test]
    runs-on: ubuntu-latest
    if: always() && github.event_name == 'pull_request'
    permissions:
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Download core coverage
        uses: actions/download-artifact@v4
        with:
          name: core-coverage
          path: coverage/core

      - name: Download vscode coverage
        uses: actions/download-artifact@v4
        with:
          name: vscode-coverage
          path: coverage/vscode

      - name: Report C# coverage on PR
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coverage/core/**/coverage.cobertura.xml
          format: markdown
          output: both
          badge: true

      - name: Add coverage comment to PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          recreate: true
          path: code-coverage-results.md

  validate-translations:
    name: Validate Translations
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Checkout translations repo
        uses: actions/checkout@v4
        with:
          repository: NFAsylum/babel-tcc-translations
          path: babel-tcc-translations

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # Valida as traducoes canonicas (o validate.py do repo de traducoes faz 4 checks:
      # sintaxe, schema, completude, unicidade). Substitui o antigo scripts/validate_translations.py
      # (removido), que era no-op no CI: procurava arquivos inexistentes no runner.
      - name: Run translation validation
        run: python babel-tcc-translations/scripts/validate.py
