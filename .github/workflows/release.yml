name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  validate:
    name: Validate Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./packages/ide-adapters/vscode/package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package.json ($PKG_VERSION)"
            exit 1
          fi

      - name: Verify tag matches Directory.Build.props version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CSPROJ_VERSION=$(sed -n 's/.*<Version>\(.*\)<\/Version>.*/\1/p' Directory.Build.props)
          if [ "$TAG_VERSION" != "$CSPROJ_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match Directory.Build.props ($CSPROJ_VERSION)"
            exit 1
          fi

  core-test:
    name: Core Tests
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Checkout translations repo
        uses: actions/checkout@v4
        with:
          repository: NFAsylum/babel-tcc-translations
          path: babel-tcc-translations

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        env:
          BABEL_TCC_TRANSLATIONS_PATH: ${{ github.workspace }}/babel-tcc-translations
        run: dotnet test --no-build --configuration Release

  vscode-test:
    name: Extension Tests
    needs: validate
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: packages/ide-adapters/vscode

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  package-and-release:
    name: Package & Release
    needs: [core-test, vscode-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout translations repo
        uses: actions/checkout@v4
        with:
          repository: NFAsylum/babel-tcc-translations
          path: babel-tcc-translations

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: packages/ide-adapters/vscode/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('packages/ide-adapters/vscode/package-lock.json') }}

      - name: Install extension dependencies
        working-directory: packages/ide-adapters/vscode
        run: npm install

      - name: Publish Core
        working-directory: packages/ide-adapters/vscode
        run: npm run publish-core

      - name: Copy translations
        working-directory: packages/ide-adapters/vscode
        env:
          BABEL_TCC_TRANSLATIONS_PATH: ${{ github.workspace }}/babel-tcc-translations
        run: npm run copy-translations

      - name: Copy README
        working-directory: packages/ide-adapters/vscode
        run: npm run copy-readme

      - name: Build extension
        working-directory: packages/ide-adapters/vscode
        run: npm run build

      - name: Install vsce and ovsx
        run: npm install -g @vscode/vsce ovsx

      - name: Package extension
        working-directory: packages/ide-adapters/vscode
        run: vsce package --out multilingual-code-${{ github.ref_name }}.vsix

      # Fail-fast + retry + idempotencia (tarefa 106): retry cura falhas transitorias;
      # idempotencia evita conflito de "versao ja existe" num rerun; sem decoupling.
      - name: Publish to Marketplace
        if: env.VSCE_PAT != ''
        working-directory: packages/ide-adapters/vscode
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Idempotencia: se a versao ja esta no Marketplace, nao republicar.
          if vsce show NFAsylum.multilingual-code --json 2>/dev/null \
               | node -e "let d={};try{d=JSON.parse(require('fs').readFileSync(0,'utf8'))}catch(e){}; process.exit((d.versions||[]).some(v=>v.version===process.argv[1])?0:1)" "$VERSION"; then
            echo "Marketplace ja esta em $VERSION - pulando (idempotente)."
            exit 0
          fi
          for attempt in 1 2 3; do
            if OUT=$(vsce publish 2>&1); then
              echo "$OUT"; echo "Publicado no Marketplace (tentativa $attempt)."; exit 0
            fi
            echo "$OUT"
            if echo "$OUT" | grep -qiE "already (exists|published)"; then
              echo "Versao ja presente no Marketplace - tratando como sucesso (idempotente)."; exit 0
            fi
            echo "Tentativa $attempt falhou; novo retry em $((attempt * 20))s..."
            sleep $((attempt * 20))
          done
          echo "::error::Falha ao publicar no Marketplace apos 3 tentativas."
          exit 1

      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        working-directory: packages/ide-adapters/vscode
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          VSIX="multilingual-code-${GITHUB_REF_NAME}.vsix"
          # Idempotencia: se a versao ja esta no Open VSX, nao republicar.
          if [ "$(curl -s -o /dev/null -w '%{http_code}' "https://open-vsx.org/api/NFAsylum/multilingual-code/$VERSION")" = "200" ]; then
            echo "Open VSX ja esta em $VERSION - pulando (idempotente)."
            exit 0
          fi
          for attempt in 1 2 3; do
            if OUT=$(ovsx publish "$VSIX" -p "$OVSX_PAT" 2>&1); then
              echo "$OUT"; echo "Publicado no Open VSX (tentativa $attempt)."; exit 0
            fi
            echo "$OUT"
            if echo "$OUT" | grep -qiE "already (exists|published)"; then
              echo "Versao ja presente no Open VSX - tratando como sucesso (idempotente)."; exit 0
            fi
            echo "Tentativa $attempt falhou; novo retry em $((attempt * 20))s..."
            sleep $((attempt * 20))
          done
          echo "::error::Falha ao publicar no Open VSX apos 3 tentativas."
          exit 1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: packages/ide-adapters/vscode/multilingual-code-${{ github.ref_name }}.vsix
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
